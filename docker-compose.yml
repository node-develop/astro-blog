services:
  postgres:
    image: postgres:18-bookworm
    container_name: astro-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog", "-d", "blog"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
