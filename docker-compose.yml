services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blog", "-d", "blog"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app_writer:app_writer_pw@postgres:5432/blog
      PORT: "3001"
      RENDER_SERVICE_URL: http://render:3002
      INDEXATION_ENABLED: ${INDEXATION_ENABLED:-false}
      SITE_URL: ${SITE_URL:-https://nltosql.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.nltosql.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.nltosql.com}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      # Production router: api.artka.dev (active when DNS points here post-cutover)
      - "traefik.http.routers.api-artka-secure.rule=Host(`api.artka.dev`)"
      - "traefik.http.routers.api-artka-secure.entrypoints=websecure"
      - "traefik.http.routers.api-artka-secure.tls.certResolver=letsencrypt"
      # Staging router: api.nltosql.com
      - "traefik.http.routers.api-nltosql-secure.rule=Host(`api.nltosql.com`)"
      - "traefik.http.routers.api-nltosql-secure.entrypoints=websecure"
      - "traefik.http.routers.api-nltosql-secure.tls.certResolver=letsencrypt"
      - "traefik.http.routers.api-nltosql-secure.middlewares=staging-noindex@docker"
      # Service definition shared by both routers
      - "traefik.http.services.api.loadbalancer.server.port=3001"
      # Middlewares
      - "traefik.http.middlewares.staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive"
    networks:
      - dokploy-network

  render:
    build:
      context: .
      dockerfile: render/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://render_reader:render_reader_pw@postgres:5432/blog
      PORT: "3002"
      INDEXATION_ENABLED: ${INDEXATION_ENABLED:-false}
      SITE_URL: ${SITE_URL:-https://nltosql.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.nltosql.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.nltosql.com}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - dokploy-network

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agent_writer:agent_writer_pw@postgres:5432/blog
      LANGGRAPH_PG_SCHEMA: langgraph
      PORT: "8000"
      INDEXATION_ENABLED: ${INDEXATION_ENABLED:-false}
      SITE_URL: ${SITE_URL:-https://nltosql.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.nltosql.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.nltosql.com}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - dokploy-network

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    environment:
      INDEXATION_ENABLED: ${INDEXATION_ENABLED:-false}
      SITE_URL: ${SITE_URL:-https://nltosql.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.nltosql.com}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.nltosql.com}
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      # Admin always served with hard noindex regardless of env
      - "traefik.http.routers.admin-artka-secure.rule=Host(`admin.artka.dev`)"
      - "traefik.http.routers.admin-artka-secure.entrypoints=websecure"
      - "traefik.http.routers.admin-artka-secure.tls.certResolver=letsencrypt"
      - "traefik.http.routers.admin-artka-secure.middlewares=admin-noindex@docker"
      - "traefik.http.routers.admin-nltosql-secure.rule=Host(`admin.nltosql.com`)"
      - "traefik.http.routers.admin-nltosql-secure.entrypoints=websecure"
      - "traefik.http.routers.admin-nltosql-secure.tls.certResolver=letsencrypt"
      - "traefik.http.routers.admin-nltosql-secure.middlewares=admin-noindex@docker"
      - "traefik.http.services.admin.loadbalancer.server.port=80"
      - "traefik.http.middlewares.admin-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive"
    networks:
      - dokploy-network

  # NOTE: `frontend` (Astro) service не входит в этот compose до Plan 2.
  # До тех пор:
  # - на artka.dev (prod) фронт обслуживается legacy Astro deploy через Dokploy
  # - на nltosql.com (staging) frontend пока недоступен; api+admin под-домены работают
  # После Plan 2 добавится сервис frontend с Traefik labels на artka.dev + nltosql.com.

volumes:
  postgres-data:

networks:
  dokploy-network:
    external: true
