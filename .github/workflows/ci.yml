name: CI

"on":
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a PR supersedes the previous run. Pushes to main (called from
# docker-publish.yml) are never cancelled: each one is a release candidate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs, one per test layer (vitest.config.ts `projects`).
# Each fails fast on its cheapest step.
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm lint
      - run: pnpm typecheck
      - name: Validate EN translations (drift + schema)
        run: pnpm translate:check
      - name: Unit tests
        run: pnpm test

      # Advisory only: Dependabot (.github/dependabot.yml) owns the actual bumps.
      - name: Audit production dependencies (non-blocking)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Headless shell only: rehype-mermaid renders diagrams at build time, and
      # two built-site tests drive a page. Nothing here needs headed Chromium.
      - name: Install Playwright Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Build and verify fresh SEO output
        run: pnpm verify:seo-build

      - name: Built-site tests (dist + standalone server)
        run: pnpm test:built

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Testcontainers Postgres; Docker is available on GitHub-hosted runners.
      - name: Database tests
        run: pnpm test:db
