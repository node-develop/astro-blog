name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Test + build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U blog"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: postgres://blog:blog@localhost:5432/blog
      SITE_URL: http://localhost:4321
      BETTER_AUTH_SECRET: ci-secret-not-for-production-min-32-chars-long
      BETTER_AUTH_URL: http://localhost:4321
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium (for rehype-mermaid)
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
