name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and verify fresh SEO output
        run: pnpm verify:seo-build

      - name: Unit tests (Postgres/Testcontainers suites run locally)
        run: pnpm exec vitest run --exclude 'tests/integration/**'

      - name: Production standalone smoke tests
        run: pnpm test:production-smoke

      - name: Production SEO utility routes
        run: pnpm exec vitest run tests/integration/seo-utility-routes.test.ts

      - name: Validate EN translations (drift + schema)
        run: pnpm translate:check

      - run: pnpm typecheck

      - run: pnpm lint
