name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate EN translations (drift + schema)
        run: pnpm translate:check

      - run: pnpm typecheck

      - name: Unit tests (integration tests require Postgres — run locally)
        run: pnpm exec vitest run --exclude 'tests/integration/**'

      - run: pnpm lint
