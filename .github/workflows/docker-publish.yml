name: Build & publish Docker image

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  # Sent by the content worker after a publication (stage 2 of the API-only
  # migration). The trigger exists ahead of the sender so the release path is
  # already in place. Runs on the default branch, so it shares the release
  # queue with pushes to main.
  repository_dispatch:
    types: [content-publish]

# Releases queue instead of cancelling a running one. GitHub keeps a single
# pending run per group, so a burst collapses to the newest run, which still
# builds the newest main. The prefix differs from ci.yml's so the called
# workflow can never wait on its own caller.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No QEMU: the image is built for linux/amd64 only (see `platforms` below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # A content publication rebuilds the same commit, so there is no
      # head_commit and BUILT_AT is the only thing that tells two images apart.
      - name: Resolve build timestamp
        id: built
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: echo "at=${COMMIT_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            SITE_URL=https://artka.dev
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.built.outputs.at }}

      - name: Trigger Dokploy deploy
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'repository_dispatch'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret is not set, skipping deploy trigger"
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST "$DOKPLOY_WEBHOOK_URL"
