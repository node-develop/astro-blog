version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per week for all minor/patch bumps; majors stay separate so
      # framework upgrades (Astro, TypeScript, Vitest) get a deliberate review.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TS 7 has no programmatic API yet (breaks @astrojs/check / typescript-eslint);
      # revisit at 7.1+ — see CLAUDE.md "Стек".
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
